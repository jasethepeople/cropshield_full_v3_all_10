version: '3.9'
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./backend:/app", "./data:/data"]
    depends_on: [redis]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    env_file: .env
    depends_on: [backend]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  hardhat:
    build: ./contracts
    ports: ["8545:8545"]
    command: npx hardhat node
